version: 2

updates:
  - package-ecosystem: nuget
    directories:
      - "/ImmichDrive"
      - "/ImmichDrive.ThumbnailProvider"
      - "/tests/ImmichDrive.CloudFilterLayout.Tests"
      - "/tests/ImmichDrive.ApiKeyMigration.Tests"
      - "/tests/ImmichDrive.UploadStatus.Tests"
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]
    ignore:
      # The app's Package.appxmanifest depends on the Microsoft.WindowsAppRuntime.2 framework;
      # 2.x minors update that framework in place, 3.0 needs the manifest dependency changed.
      - dependency-name: Microsoft.WindowsAppSDK
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
