# Publishes ImmichDrive to the Microsoft Store through winui-app-kit's reusable workflow (CI-10,
# REL-7), copied from the kit's tests/store/callers/store-publish.yml. A v* tag runs the gate, builds
# both architectures unsigned, bundles them, uploads a draft with release-notes/<version>.md as
# "What's new", and stops. A manual run on the same tag with submit_draft commits that draft. A manual
# dry_run builds and checks everything and makes no Store call. See docs/packaging.md.
# Keep the `uses:` tag equal to the external/winui-app-kit pin; the workflow stops if they differ.
name: Publish to Microsoft Store

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build, bundle and check, then stop before any Store call'
        type: boolean
        default: false
      no_commit:
        description: 'Stage a draft for review in Partner Center without submitting'
        type: boolean
        default: true
      repair_draft:
        description: 'Existing draft ID to repair with both architectures; requires no_commit'
        type: string
        default: ''
      replace_canceled_draft:
        description: 'Exact canceled tier submission ID to replace with a corrected release'
        type: string
        default: ''
      submit_draft:
        description: 'Draft ID from the tag run to submit for certification; run on that release tag with no_commit unchecked'
        type: string
        default: ''
      replace_failed_draft:
        description: 'Exact CommitFailed submission ID to replace after correcting its package'
        type: string
        default: ''
      failed_upload:
        description: 'Exact upload filename in the failed submission being replaced'
        type: string
        default: ''
      hold_publication:
        description: 'With submit_draft: hold the release for manual publication in Partner Center'
        type: boolean
        default: false
      inspect_draft:
        description: 'Submission ID to report (status, pricing, publishing mode) without changing anything'
        type: string
        default: ''

permissions:
  contents: read

# One Store run at a time, and never cancel one that has started talking to Partner Center.
concurrency:
  group: store-package
  cancel-in-progress: false

jobs:
  publish:
    uses: Dynamic-Solutions-Canada/winui-app-kit/.github/workflows/store-publish.yml@v1.20.3
    with:
      store_product_id: 9MWC6165N7DH
      # US $0.99 base price. The published submission reports Base, but the Store CLI needs Tier1012
      # for this product; regional prices can change when the tier is applied.
      price_tier: 'Tier1012'
      # The Cloud Files struct layout check (x64 runner), then the MSIX images and app icons. The kit
      # stops on any failed command, native ones included.
      pre_build: >-
        dotnet run --project tests/ImmichDrive.CloudFilterLayout.Tests/ImmichDrive.CloudFilterLayout.Tests.csproj -c Release;
        & ./ImmichDriveMSIX/generate-msix-images.ps1
      # The gate run first, on Linux; this is the default.
      gate_command: 'npm run validate'
      # A tag run is always a draft (REL-7); these only matter for manual runs.
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      no_commit: ${{ github.event_name == 'push' || inputs.no_commit }}
      repair_draft: ${{ inputs.repair_draft || '' }}
      replace_canceled_draft: ${{ inputs.replace_canceled_draft || '' }}
      submit_draft: ${{ inputs.submit_draft || '' }}
      replace_failed_draft: ${{ inputs.replace_failed_draft || '' }}
      failed_upload: ${{ inputs.failed_upload || '' }}
      hold_publication: ${{ github.event_name == 'workflow_dispatch' && inputs.hold_publication }}
      inspect_draft: ${{ inputs.inspect_draft || '' }}
    secrets: inherit
