name: Build and Package

# Nothing built here is published, anywhere. ImmichDrive is a paid app in a public repo,
# and an Actions artifact on a public repo needs only read access to download, which is
# everyone. Handing out an unpackaged build instead is not an option either: the Cloud Files
# sync root and the IThumbnailProvider COM server are registered only by
# ImmichDriveMSIX/Package.appxmanifest (com:ExeServer + desktop3:CloudFiles), so without
# package identity there is no working product to give away. The install route is the
# Microsoft Store (https://apps.microsoft.com/detail/9MWC6165N7DH); anyone who wants to run it
# from source builds it themselves, which the repo has everything for.
#
# Store submission runs separately in store-publish.yml on release tags. This workflow
# retains the signed packaging checks and notes-only GitHub release.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Creates a GitHub Release, so a run in progress is never cancelled.
concurrency:
  group: build-msix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # CI-4: the same gate a developer runs, before anything is built or released.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The gate runs winui-app-kit's scripts (dotnet, pwsh, run-tests, check-listing, check-gitignore).
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # check:icons runs devkit, which needs Node 22.12 or later, below 25 (the kit's Store workflow uses 24).
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate
        run: npm run validate

  build:
    needs: validate
    runs-on: windows-2025
    # Two self-contained publishes, image generation, makepri, makeappx and signing.
    timeout-minutes: 45

    strategy:
      matrix:
        platform: [x64, ARM64]

    env:
      PLATFORM: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # This windows-2025 job is x64; it does not execute the ARM64 package.
      - name: Check Cloud Files native layout
        if: matrix.platform == 'x64'
        shell: pwsh
        run: dotnet run --project tests/ImmichDrive.CloudFilterLayout.Tests/ImmichDrive.CloudFilterLayout.Tests.csproj -c Release

      # -- Extract version from Directory.Build.props --------------
      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $ver = $props.Project.PropertyGroup[0].Version
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Detected version: $ver"

      # -- Build the MSIX package ----------------------------------
      # This build produces no downloadable output on purpose, and it is still the point of the
      # job: it is the only automated check that manifest stamping, makepri, makeappx and
      # signing all still work. Delete it and the next break in the packaging pipeline surfaces
      # during a Store submission instead of on the commit that caused it. Keep it.
      #
      # Signs with a throwaway self-signed certificate created for this run, with a random
      # password that is never stored. Nothing from this build is published, so no real
      # code-signing certificate is needed; signing still runs so the Publisher stamp and
      # signtool step are checked. The script itself never creates a certificate or holds a
      # password (FIX-060).
      - name: Build MSIX
        shell: pwsh
        run: |
          $password = [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(32))
          Write-Host "::add-mask::$password"
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=ImmichDrive-CI" `
            -KeyUsage DigitalSignature -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
          $pfx = Join-Path $env:RUNNER_TEMP "ci-signing.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfx `
            -Password (ConvertTo-SecureString -String $password -Force -AsPlainText) | Out-Null
          Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -DeleteKey
          # winui-app-kit's packaging script, driven by windows-build.json, run from the repo root.
          & "external/winui-app-kit/build/build-msix.ps1" -Platform $env:PLATFORM -TrustedPfxPath $pfx -TrustedPfxPassword $password
          $buildExit = $LASTEXITCODE
          Remove-Item $pfx -Force
          if ($buildExit -ne 0) { Write-Error "build-msix failed"; exit 1 }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    # No artifact passes between the jobs any more, but the dependency stays: a tag should not
    # get a release if the package it names does not build.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout (for git log)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read release notes
        id: notes
        run: |
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          NOTES="release-notes/${CURRENT_TAG#v}.md"
          # REL-6: never fall back to commit subjects or generated notes.
          if [ ! -s "$NOTES" ]; then echo "::error::Missing release notes: $NOTES"; exit 1; fi
          BODY=$(cat "$NOTES")
          {
            echo "RELEASE_BODY<<RELEASE_EOF"
            echo "## What's new"
            echo ""
            echo "$BODY"
            echo ""
            echo "## Install"
            echo ""
            echo "ImmichDrive installs from the [Microsoft Store](https://apps.microsoft.com/detail/9MWC6165N7DH), where it is listed as Drive for Immich."
            echo ""
            echo "*AI disclosure: this release and the related code were written with the assistance of AI.*"
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"

      # Notes and the tag, no assets. See the comment at the top of this file for why nothing
      # binary is published from here.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body: ${{ steps.notes.outputs.RELEASE_BODY }}
          generate_release_notes: false
