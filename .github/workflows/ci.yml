name: CI

# The push and pull request gate (CI-1). The Linux job runs the same `npm run validate` a developer
# runs locally, on every push to main and every pull request, with no path filter. The Windows
# compile (CI-3) costs Windows runner minutes, so it runs only when app source, packaging or build
# configuration changed; it compiles both shipped projects, which `verify:desktop` does not.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The gate runs winui-app-kit's scripts (dotnet, pwsh, run-tests, check-listing, check-gitignore).
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # check:icons runs devkit, which needs Node 22.12 or later, below 25 (the kit's Store workflow uses 24).
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Portable harnesses and the Store workflow script tests; ubuntu-latest ships pwsh.
      - name: Validate
        run: npm run validate

  changes:
    name: Detect Windows-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      windows: ${{ steps.filter.outputs.windows }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Plain git instead of a third-party filter action. A push that creates main, or any case
      # where the base cannot be found, compiles rather than guessing.
      - name: Filter paths
        id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${BASE}" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "No usable base commit; compiling."
            echo "windows=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pattern='^(ImmichDrive/|ImmichDrive\.ThumbnailProvider/|ImmichDriveMSIX/|external/|Directory\.Build\.(props|targets)$|global\.json$|ImmichDrive\.slnx$|\.github/workflows/ci\.yml$)'
          if git diff --name-only "${BASE}" HEAD | grep -Eq "${pattern}"; then
            echo "windows=true" >> "$GITHUB_OUTPUT"
          else
            echo "windows=false" >> "$GITHUB_OUTPUT"
          fi

  compile:
    name: Compile (Windows ${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-2025
    # A cold restore of the Windows App SDK plus two projects; well under this on a warm runner.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Compile the app and the thumbnail provider
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          foreach ($project in @('ImmichDrive/ImmichDrive.csproj', 'ImmichDrive.ThumbnailProvider/ImmichDrive.ThumbnailProvider.csproj')) {
            dotnet build $project -c Debug "-p:Platform=$env:PLATFORM"
            if ($LASTEXITCODE -ne 0) { throw "Compile failed for $project ($env:PLATFORM)" }
          }
