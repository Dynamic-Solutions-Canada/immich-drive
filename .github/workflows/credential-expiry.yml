# Warns before the Entra client secret behind store-publish.yml expires (CI-11), through
# winui-app-kit's reusable workflow; it fails 60 days before the date. The date is an organization
# variable shared by every Store app (a repository copy would hide it); set it whenever
# AZURE_AD_APPLICATION_SECRET is created or rotated:
#   gh variable set STORE_SECRET_EXPIRES --org Dynamic-Solutions-Canada --body YYYY-MM-DD
# A failed scheduled run emails the owner; no issue is opened, because an issue announcing when the
# publishing credential lapses would be public.
name: Credential Expiry

on:
  schedule:
    # Mondays at 13:00 UTC (9 a.m. Toronto in EDT, 8 a.m. in EST).
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: credential-expiry
  cancel-in-progress: true

jobs:
  check:
    uses: Dynamic-Solutions-Canada/winui-app-kit/.github/workflows/credential-expiry.yml@v2.10.1
    with:
      expires: ${{ vars.STORE_SECRET_EXPIRES }}
