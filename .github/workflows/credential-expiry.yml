name: Credential Expiry

# Warn before the Entra client secret behind store-publish.yml expires (CI-11).
#
# Entra client secrets last 24 months at most. Without this, the reminder that the secret lapsed
# is a failed Store submission on release day, with an authentication error that names nothing
# useful.
#
# No API call answers "when does my own secret expire?": reading an app registration's
# passwordCredentials needs Graph permissions the Store credential does not have and should not
# be given. So the date is kept in a repository VARIABLE (an expiry date is not sensitive), set
# whenever AZURE_AD_APPLICATION_SECRET is created or rotated:
#
#   gh variable set STORE_SECRET_EXPIRES --body YYYY-MM-DD
#
# This deliberately does not open an issue. A failed scheduled run already emails the repo owner,
# and this repository is public: an issue announcing when the publishing credential lapses is
# free information for anyone watching.

on:
  schedule:
    # Mondays at 13:00 UTC (9 a.m. Toronto in EDT, 8 a.m. in EST).
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: credential-expiry
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the Store credential's expiry
        env:
          EXPIRES: ${{ vars.STORE_SECRET_EXPIRES }}
          # Start warning this far out: long enough to schedule a rotation rather than scramble.
          WARN_DAYS: '60'
        run: |
          set -euo pipefail

          if [ -z "${EXPIRES}" ]; then
            echo "::error::STORE_SECRET_EXPIRES is not set, so nothing is watching the Store credential."
            echo "Set it with: gh variable set STORE_SECRET_EXPIRES --body YYYY-MM-DD"
            exit 1
          fi

          # Reject a malformed date rather than letting `date` coerce it into something wrong.
          if ! printf '%s' "${EXPIRES}" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::STORE_SECRET_EXPIRES is '${EXPIRES}', expected YYYY-MM-DD."
            exit 1
          fi

          expires_at=$(date -u -d "${EXPIRES}" +%s)
          now=$(date -u +%s)
          days=$(( (expires_at - now) / 86400 ))

          {
            echo "## Microsoft Store credential"
            echo
            echo "\`AZURE_AD_APPLICATION_SECRET\` expires **${EXPIRES}** (${days} days)."
            echo
            echo "Rotate it in Entra (App registrations, the Store app, Certificates & secrets),"
            echo "update the repository secret, then run: gh variable set STORE_SECRET_EXPIRES --body YYYY-MM-DD"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${days}" -lt 0 ]; then
            echo "::error::The Store credential expired ${EXPIRES} ($(( -days )) days ago). store-publish.yml cannot authenticate."
            exit 1
          fi

          if [ "${days}" -le "${WARN_DAYS}" ]; then
            echo "::error::The Store credential expires in ${days} days (${EXPIRES}). Rotate it."
            exit 1
          fi

          echo "Store credential expires ${EXPIRES}, ${days} days away; nothing to do."
