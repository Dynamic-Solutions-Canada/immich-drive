# Git hooks (HYG-10): block what must never be committed. Hooks check staged files only and stay
# fast; tests belong to CI. Install lefthook, then run `lefthook install` once per clone.
min_version: 2.2.2

pre-commit:
  parallel: true
  jobs:
    - name: devkit precommit
      # The kit's shared check (HYG-10): signing material and keys, .env files other than examples,
      # .secrets/, staged private-key text, and files over 5 MB (a release asset, not the repo).
      run: external/winui-app-kit/scripts/devkit precommit --max-size 5MB

    - name: no other signing material or credential folders
      # What devkit does not cover: strong-name keys (SEC-11; the shared dev certificate comes
      # from the build tools), AWS credentials and the build bridge's private folder.
      glob: "{*.snk,**/*.snk,.aws/**,**/.aws/**,.windows-build/**}"
      run: 'echo "Signing material and credentials must not be committed: {staged_files}" && exit 1'

    - name: no settings or protected key files
      # A user's settings.json or protected API key file must never be committed (SEC-1, CONF-5).
      glob: "{**/settings.json,**/protected-*.dat}"
      exclude:
        - ".claude/settings.json"
        - ".vscode/settings.json"
      run: 'echo "App data files must not be committed: {staged_files}" && exit 1'
